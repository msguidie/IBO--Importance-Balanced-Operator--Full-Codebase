# TandemFoilSet x IBO (one subset per run: --subset cruise_aoa0 | cruise_aoa5
# | cruise_random | takeoff | racecar | all).
# Adopted from the subset's cache at launch (Dataset.calibration): the rotary
# domain, scales and bases, the Fourier SDF scale and the slots per token
# (the subset's mean occupancy); the values below are placeholders.
ibo:
  n_tokens: 4096
  n_slots: 32
  cache_knn: 8
  knn: 8
  head_dim: 64                 # 6 heads
  n_blocks: 5
  n_register: 4
  long_skips: true
  adaln: zero                  # per-block zero-initialised conditioning on (U, angle of attack)
  encoder_film: true
  decoder_cond_concat: true
  pn_hidden: 128
  pn_out: 192
  pn_act: silu
  pn_fp32_first: true
  token_proj_layers: 2
  init: trunc_normal
  decoder_dh: 384
  decoder_heads: 6
  decoder_stages: 2
  decoder_register_attn: true
  head_hidden: 512
  fourier_sdf_scale: 10.0
  fourier_sdf_clip: 8.0
  idw_lambda_clip: 8.0
  idw_log_ratio_clip: 8.0
  rope_dims: [32, 32]
  rope_base: [5.7, 2.7]
  rope_scales: [32.0, 16.0]
  rope_domain_lo: [-9.9, -9.9]
  rope_domain_hi: [13.9, 9.9]
training:
  epochs: 400
  cases_per_gpu: 1
  effective_batch: 4
  n_query: 32000
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_fraction: 0.05
  warmup_steps: null
  min_lr_fraction: 0.02
  loss_vol_weights: null
evaluation:
  decode_chunk: 32000
