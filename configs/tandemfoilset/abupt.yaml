# TandemFoilSet x AB-UPT: 4,096 volume + 960 surface anchors (750 surface
# anchors on racecar and takeoff, whose smallest meshes have fewer wall
# nodes), the inflow condition through the stem, Lion 5e-5 / 0.05.
# The coordinate affine (domain corner -> 0, longest extent -> 1000) is set
# per subset at launch (Dataset.calibration); the values are placeholders.
abupt:
  vol_anchors: 4096
  surf_anchors: 960
  pos_offset: [9.9, 9.9]
  pos_scale: 42.0
  infer_chunk: 65536
training:
  epochs: 400
  cases_per_gpu: 1
  effective_batch: 4
  n_query: 32000
  loss_vol_weights: null
evaluation:
  decode_chunk: 32000
subsets:
  racecar:
    abupt.surf_anchors: 750
  takeoff:
    abupt.surf_anchors: 750
