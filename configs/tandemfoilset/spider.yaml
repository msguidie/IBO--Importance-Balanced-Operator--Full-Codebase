# TandemFoilSet x SpiderSolver: 8 layers, width 256, 5 onion shells, 4
# template clusters per airfoil (8 sectors), one mean surface token, Adam
# with the one-cycle schedule 4e-5 -> 1e-3 -> 4e-8. The surface quota
# (density matched: round(n_query x median train surface fraction)) and the
# innermost set (10% of the volume rows) are set per subset at launch; the
# values below are placeholders.
# Needs `python -m ibo derive --dataset tandemfoilset --model spider --subset <s>` once.
spider:
  onion_num: 5
  surf_token_mode: single
  n_clusters: 8
  n_inner: 3100
  surf_quota: 1000
  infer_chunk: 32000
training:
  epochs: 400
  cases_per_gpu: 1
  effective_batch: 4
  n_query: 32000
  loss_vol_weights: null
