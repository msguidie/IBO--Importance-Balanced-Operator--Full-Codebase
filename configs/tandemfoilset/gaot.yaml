# TandemFoilSet x GAOT: a 64 x 64 latent grid, 5 ViT layers of width 384,
# the published AdamW + three-phase schedule (the `gaot` defaults of
# ibo/config.py). Runs eager: per-case edge counts differ.
# Needs `python -m ibo derive --dataset tandemfoilset --model gaot --subset <s>` once.
training:
  epochs: 400
  cases_per_gpu: 1
  effective_batch: 4
  n_query: 32000
  compile: false
  loss_vol_weights: null
