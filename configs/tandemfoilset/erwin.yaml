# TandemFoilSet x Erwin (the airfoil configuration): two levels of width 64,
# ball size 256, 6 + 6 encoder and 6 decoder blocks, stride 1, kNN-8 message
# passing, the inflow condition appended to the random-Fourier coordinates;
# AdamW 1e-3 / 1e-5, 5% warm-up, per-step cosine to 1e-7.
erwin:
  c_hidden: [64, 64]
  ball_sizes: [256, 256]
  enc_num_heads: [8, 8]
  enc_depths: [6, 6]
  dec_num_heads: [8]
  dec_depths: [6]
  strides: [1]
  lr: 1.0e-3
  weight_decay: 1.0e-5
  warmup_fraction: 0.05
  end_lr: 1.0e-7
  infer_chunk: 32000
training:
  epochs: 400
  cases_per_gpu: 1
  effective_batch: 4
  n_query: 32000
  loss_vol_weights: null
